<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glömt lösenord - Kakservice</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="site-header" data-header>
      <div class="container header-inner">
        <a href="index.html" class="logo" aria-label="Hem">Klass Kraft UF</a>

        <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Öppna meny">
          <span class="nav-toggle__bar" aria-hidden="true"></span>
          <span class="nav-toggle__bar" aria-hidden="true"></span>
          <span class="nav-toggle__bar" aria-hidden="true"></span>
        </button>

        <nav id="site-nav" class="site-nav" aria-label="Huvudmeny">
          <ul class="nav-list">
            <li class="nav-item"><a href="produkter.html">Produkter</a></li>
            <li class="nav-item"><a href="sa-funkar-det.html">Så funkar det</a></li>
            <li class="nav-item"><a href="om-oss.html">Om oss</a></li>
            <li class="nav-item"><a href="login.html" class="btn btn--sm btn--ghost">Min förening</a></li>
            <li class="nav-item"><a href="börja-sälja.html" class="btn btn--sm btn--primary">Börja sälja</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Glömt lösenord?</h1>
                        <p>Ange din e-postadress så skickar vi en länk för att återställa ditt lösenord.</p>
                    </div>

                    <form id="forgot-password-form" class="form">
                        <div class="form-group">
                            <label for="email" class="form-label">E-postadress</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                required
                                placeholder="din@email.se"
                            >
                        </div>

                        <button type="submit" class="btn btn--primary btn--full">
                            Skicka återställningslänk
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p>Kommer du ihåg ditt lösenord? <a href="login.html">Logga in här</a></p>
                    </div>

                    <!-- Messages -->
                    <div id="message-container" class="message-container" style="display: none;">
                        <div id="message" class="message"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>


         
 

    <!-- Scripts -->
    <script>
        // Load config based on environment
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            document.write('<script src="config.local.js"><\/script>');
        } else {
            // Production - inject environment variables
            window.SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
            window.SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        }
    </script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/forgot-password.js"></script>
</body>
</html>
